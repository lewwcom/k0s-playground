services:
  k0s-controller:
    container_name: k0s-controller
    image: k0sproject/k0s:v1.36.4-k0s.1
    command: ["k0s", "controller", "--enable-worker", "--no-taints"]
    post_start:
      # Loop device for Ceph. OrbStack's VM has no udevd, and ceph-volume reads
      # /run/udev/data/* for every block device, so we run our own eudev and
      # rebuild the db on each start (/run is tmpfs).
      #
      # On a real Linux host, consider removing this hook: the host's udevd
      # already provides the db. If kept, expect small side effects: the
      # container's udevd also receives the host's kernel uevents and its
      # default rules may touch shared state (e.g. kmod load, sysfs writes).
      # Don't mount the host's /dev, /run/udev or /lib/modules in this case.
      - command:
          - sh
          - -c
          - |
            apk add eudev
            pidof udevd || udevd --daemon
            until pidof udevd; do :; done
            [ -e /dev/loop99 ] || mknod /dev/loop99 b 7 99
            fallocate -l 6G /vol/disk.raw
            losetup -a | grep loop99 || losetup /dev/loop99 /vol/disk.raw
            udevadm trigger --action=add --subsystem-match=block
            udevadm settle
        privileged: true
      # Cilium needs various mountpoints to be shared
      # (https://lwn.net/Articles/689856/)
      - command: mount --make-rshared /
        privileged: true
    hostname: k0s-controller
    network_mode: bridge # other modes are unsupported
    extra_hosts:
      - "nexus.k0s.localhost:host-gateway"
      - "nexus.k0s.host.docker.internal:host-gateway"
      - "authentik.k0s.localhost:host-gateway"
      - "authentik.k0s.host.docker.internal:host-gateway"
    ports:
      - 6443:6443 # publish the Kubernetes API server port
      - 30080:30080 # HTTP ingress 
      - 30443:30443 # HTTPS ingress
      - 30018:30018 # gogs
    volumes:
      - /var/lib/k0s # this is where k0s stores its data
      - ./image-bundle.tar:/var/lib/k0s/images/image-bundle.tar # airgap image bundles
      - /var/log/pods # this is where k0s stores pod logs
      - /dev/kmsg:/dev/kmsg:ro # required by kubelets OOM watcher
      - ./k0s.yaml:/etc/k0s/k0s.yaml
      - /vol
    tmpfs:
      - /run # this is where k0s stores runtime data
    devices:
      - /dev/kmsg # required by kubelet's OOM watcher
    privileged: true
    security_opt:
      - seccomp:unconfined # allow access to the session keyring

  step-ca:
    container_name: step-ca
    image: smallstep/step-ca:0.29.0
    command:
      - /usr/local/bin/step-ca
      # validate ACME HTTP-01 challenges on port 30080
      - --acme-http-port=30080
      # --insecure is required to unlock --acme-http-port
      - --insecure
      - --password-file=/home/step/secrets/password
      - /home/step/config/ca.json
    network_mode: bridge
    ports:
      - 9000:9000
    environment:
      DOCKER_STEPCA_INIT_NAME: "k0s Local CA"
      # SANs for step-ca's own HTTPS server cert
      DOCKER_STEPCA_INIT_DNS_NAMES: "localhost,host.docker.internal,step-ca"
      DOCKER_STEPCA_INIT_ACME: "true"
    extra_hosts:
      - "argocd.k0s.localhost:host-gateway"
      - "authentik.k0s.localhost:host-gateway"
      - "ceph.k0s.localhost:host-gateway"
      - "gogs.k0s.localhost:host-gateway"
      - "nexus.k0s.localhost:host-gateway"
      - "radar.k0s.localhost:host-gateway"

      - "argocd.k0s.host.docker.internal:host-gateway"
      - "authentik.k0s.host.docker.internal:host-gateway"
      - "ceph.k0s.host.docker.internal:host-gateway"
      - "gogs.k0s.host.docker.internal:host-gateway"
      - "nexus.k0s.host.docker.internal:host-gateway"
      - "radar.k0s.host.docker.internal:host-gateway"
    volumes:
      - /home/step


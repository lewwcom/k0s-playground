apps:
  - name: cilium
    namespace: kube-system
    repo: quay.io/cilium/charts
    chart: cilium
    revision: 1.20.2
    values: cilium.values.yaml

  - name: rook-ceph-operator
    namespace: rook-ceph
    repo: https://charts.rook.io/release
    chart: rook-ceph
    revision: v1.20.8
    values: rook-ceph-operator.values.yaml

  - name: ceph-csi-drivers
    namespace: rook-ceph
    repo: https://ceph.github.io/ceph-csi-operator
    chart: ceph-csi-drivers
    revision: 1.0.4 # Should follow charts.rook.io/rook-ceph verison
    values: ceph-csi-drivers.values.yaml

  - name: cert-manager
    # repo: harbor.example.com/quay.io/jetstack/charts
    repo: quay.io/jetstack/charts 
    chart: cert-manager
    revision: v1.20.2
    values: cert-manager.values.yaml

  - name: skyhook-radar
    repo: https://skyhook-io.github.io/helm-charts
    chart: radar
    revision: 1.14.1
    values: skyhook-radar.values.yaml

  - name: cloudnative-pg
    namespace: cnpg-system
    repo: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    revision: 0.29.1
    values: cloudnative-pg.values.yaml

  - name: authentik
    repo: https://charts.goauthentik.io
    chart: authentik
    revision: 2026.8.5
    values: authentik.values.yaml


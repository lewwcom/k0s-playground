apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gogs
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kong
      namespace: kong
  hostnames:
    - argocd.k0s.localhost
    - argocd.k0s.host.docker.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          port: 80
          weight: 1

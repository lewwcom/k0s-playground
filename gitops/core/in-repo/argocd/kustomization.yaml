apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.4/manifests/install.yaml
  - httproute.yaml

images:
  - name: ghcr.io/dexidp/dex
    newName: nexus.k0s.localhost:30443/ghcr.io/dexidp/dex
  - name: public.ecr.aws/docker/library/redis
    newName: nexus.k0s.localhost:30443/public.ecr.aws/docker/library/redis
  - name: quay.io/argoproj/argocd
    newName: nexus.k0s.localhost:30443/quay.io/argoproj/argocd

patches:
  # admin.password: password | bcrypt | base64
  # admin.passwordMtime: date -d @0 -u +%FT%T%Z | base64
  # Corresponding accounts.radar.tokens[0]:
  #   jwt(algo=HS256, secret=argocd, payload={"iss":"argocd","sub":"radar:apiKey","iat":0,"jti":"bootstrap"}) =
  #     eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJhcmdvY2QiLCJzdWIiOiJyYWRhcjphcGlLZXkiLCJpYXQiOjAsImp0aSI6ImJvb3RzdHJhcCJ9.-KPX4pcIbrN7y-ToiJVfoB57k-hdEdCdkEP0fXRiaCM
  - patch: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-secret
      data:
        server.secretkey: YXJnb2Nk
        admin.password: JDJiJDEwJFlqL3dMb1ZVRmZPN1BiTWtDSGtmTXVOblBra3ZtVlZLdFRTVTFQUnFIS1d2enhVMFNmVndL
        admin.passwordMtime: MTk3MC0wMS0wMVQwMDowMDowMFVUQw==
        accounts.radar.tokens: W3siaWQiOiJib290c3RyYXAiLCJpYXQiOjB9XQ==

  - patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"

  - patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        # Must define to support OIDC
        url: http://argocd.k0s.localhost:30080
        additionalUrls: https://argocd.k0s.localhost:30443

        exec.enabled: "true"
        accounts.radar: apiKey
        kustomize.buildOptions: "--enable-helm"

        oidc.config: |
          name: Authentik
          issuer: http://authentik.k0s.localhost:30080/application/o/argo-cd/
          clientID: argocd
          clientSecret: client-secret

  - patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-rbac-cm
      data:
        policy.csv: |
          g, radar, role:readonly
          g, authentik Admins, role:admin

replacements:
  - sourceValue: IfNotPresent
    targets:
      - select:
          kind: Deployment
        fieldPaths:
          - spec.template.spec.containers.*.imagePullPolicy
      - select:
          kind: StatefulSet
        fieldPaths:
          - spec.template.spec.containers.*.imagePullPolicy
      - select:
          kind: Deployment
          name: argocd-dex-server
        fieldPaths:
          - spec.template.spec.initContainers.*.imagePullPolicy


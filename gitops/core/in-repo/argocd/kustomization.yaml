apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.4/manifests/install.yaml
  - httproute.yaml

# images:
#   - name: ghcr.io/dexidp/dex

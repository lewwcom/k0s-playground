apiVersion: ceph.rook.io/v1
kind: CephFilesystem
metadata:
  name: loop
spec:
  metadataPool:
    replicated:
      size: 1
      requireSafeReplicaSize: false
  dataPools:
    - name: replicated
      replicated:
        size: 1
        requireSafeReplicaSize: false
  metadataServer:
    activeCount: 1

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: loop-rook-cephfs
provisioner: operator-namepsace.cephfs.csi.ceph.com
parameters:
  clusterID: cluster-namespace
  fsName: loop
  pool: loop-replicated
  mounter: fuse # OrbStack doesn't include Ceph module

  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: cluster-namespace
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: cluster-namespace
  csi.storage.k8s.io/controller-publish-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-publish-secret-namespace: cluster-namespace
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: cluster-namespace
reclaimPolicy: Delete


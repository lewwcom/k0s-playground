apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loop-ceph-cluster
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kgateway-proxy
      namespace: kgateway
  hostnames:
    - ceph.k0s.localhost
    - ceph.k0s.host.docker.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: rook-ceph-mgr-dashboard
          port: 7000
          weight: 1


apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gogs

resources:
  - namespace.yaml
  - pvc.yaml
  - deploy.yaml
  - service.yaml
  - httproute.yaml

configMapGenerator:
  - name: gogs
    files:
      - gogs.ini

secretGenerator:
  - name: gogs-admin
    literals:
      - ADMIN_USER=gogs-admin
      - ADMIN_PASSWORD=password


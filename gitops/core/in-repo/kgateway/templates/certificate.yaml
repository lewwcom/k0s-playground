apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "common.names.fullname" . }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  secretName: {{ include "common.names.fullname" . }}-tls
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: {{ include "common.names.fullname" . }}-acme
  dnsNames:
    {{- toYaml .Values.tls.dnsNames | nindent 4 }}

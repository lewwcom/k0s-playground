apiVersion: gateway-operator.konghq.com/v2beta1
kind: GatewayConfiguration
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  controlPlaneOptions:
    # IMPORTANT: ingressClass is REQUIRED even when using only Gateway API
    # (HTTPRoute, GRPCRoute, etc.) and NOT using legacy Ingress resources.
    #
    # WHY: The ControlPlane uses ingressClass to filter which KongClusterPlugin
    # resources with label "global: true" should be applied globally to the Kong
    # instance.
    #
    # IMPLEMENTATION:
    # 1. The ingressClass value is passed as an environment variable to the
    #    controller (passed to Store.New() which creates the ingressClass
    #    matcher)
    #
    #    See: https://github.com/Kong/kong-operator/blob/v2.1.3/ingress-controller/internal/manager/run.go#L225
    #
    # 2. When building the Kong configuration, the controller lists global
    #    plugins by calling s.ListGlobalKongClusterPlugins() (s is a Store)
    #
    #    See: https://github.com/Kong/kong-operator/blob/v2.1.3/ingress-controller/internal/dataplane/kongstate/kongstate.go#L635
    #
    # 3. ListGlobalKongClusterPlugins() filters plugins by matching the
    #    "kubernetes.io/ingress.class" annotation against the configured
    #    ingressClass:
    #
    #    - Looks for label "global: true"
    #    - Matches annotation "kubernetes.io/ingress.class" against ingressClass
    #      value
    #
    #    See: https://github.com/Kong/kong-operator/blob/v2.1.3/ingress-controller/internal/store/store.go#L616
    #
    # This design is inherited from Kong Ingress Controller's Ingress-based
    # architecture where ingressClass was critical for filtering which Ingress
    # resources to watch. If you only use Gateway resource family, only the
    # plugin filtering logic remains relevant, but the parameter is still
    # required because the controller uses the same Store and filtering logic
    # for both.
    #
    # SOLUTION: Always set ingressClass, even if you only use Gateway API
    # resources. Make sure KongClusterPlugin resources have matching
    # "kubernetes.io/ingress.class" annotation.
    ingressClass: {{ include "common.names.fullname" . }}
    featureGates:
      - name: FallbackConfiguration
        state: enabled
    translation:
      combinedServicesFromDifferentHTTPRoutes: enabled
      fallbackConfiguration:
        useLastValidConfig: enabled
      drainSupport: enabled

  dataPlaneOptions:
    deployment:
      replicas: 1
      podTemplateSpec:
        spec:
          containers:
            - name: proxy
              image: {{ include "common.images.image" ( dict "imageRoot" .Values.image "global" .Values.global "chart" .Chart ) }}
              env:
                - name: KONG_TRACING_INSTRUMENTATIONS
                  value: all
                - name: KONG_TRACING_SAMPLING_RATE
                  value: "1.0"
              {{- range $key, $value := .Values.dataplane.env }}
                - name: {{ $key }}
                  value: {{ $value | quote }}
              {{- end }}
              # See: https://developer.konghq.com/gateway/resource-sizing-guidelines/
              resources:
                limits:
                  cpu: "2"
                  memory: 4000Mi
                requests:
                  cpu: "1"
                  memory: 2000Mi
              # ports:
              #   - name: proxy
              #     containerPort: 8000
              #     protocol: TCP
              #     hostPort: 80
              #   - name: proxy-ssl
              #     containerPort: 8443
              #     protocol: TCP
              #     hostPort: 443

    network:
      services:
        ingress:
          # type: ClusterIP
          type: NodePort

  listenersOptions:
    - name: http
      nodePort: {{ .Values.service.http.nodePort }}


apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.36/deploy/local-path-storage.yaml

images:
  - name: docker.io/rancher/local-path-provisioner
    newName: nexus.k0s.localhost:30443/docker.io/rancher/local-path-provisioner

patches:
  - patch: |-
      kind: ConfigMap
      apiVersion: v1
      metadata:
        name: local-path-config
        namespace: local-path-storage
      data:
        helperPod.yaml: |-
          apiVersion: v1
          kind: Pod
          metadata:
            name: helper-pod
          spec:
            priorityClassName: system-node-critical
            tolerations:
              - key: node.kubernetes.io/disk-pressure
                operator: Exists
                effect: NoSchedule
            containers:
              - name: helper-pod
                image: nexus.k0s.localhost:30443/docker.io/library/busybox
                imagePullPolicy: IfNotPresent

